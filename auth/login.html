<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Portal — Sign In</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <button class="theme-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
    <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <div class="card">
    <div class="brand">CampusConnect</div>
    <h1>Sign in</h1>
    <p class="subtitle">Enter your college email or roll number to access the portal</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="userId">Email / Roll No</label>
        <input type="text" id="userId" name="userId" placeholder="name@college.edu or Roll No" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Sign in</button>
    </form>

    <div class="footer-link">
      New to the portal? <a href="signup.html">Activate account</a>
    </div>

    <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--muted);line-height:1.4;">
      College Management System &bull; Open Academic Portfolio Demo
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</body>
</html>
