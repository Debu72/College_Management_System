<!-- Author: Bikram Panja                         Last Edited: 25-11-2026
     Unified role-based portal dashboard for Notices, Class Routine, Attendance, Assignments, and Admin Directory. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABC College</title>
<link rel="stylesheet" href="home.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="home.html"><b>ABC College</b></a>
    <button class="menu" id="menu" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav"></nav>
  </div>
</header>

<main>

  <!-- Notice Board -->
  <section id="notices" class="block" style="padding-top:20px;">
    <div class="wrap">
      <div class="panel-header">
        <h1 style="margin:0;font-size:22px;color:var(--text-main);">Notice Board</h1>
        <div id="adminNoticeAction"></div>
      </div>

      <div class="tools">
        <div id="cats" class="cats" role="group" aria-label="Filter by category"></div>
        <input id="nq" type="search" placeholder="Search notices by keyword..." aria-label="Search notices">
      </div>
      <ul id="nlist" class="nlist"></ul>
    </div>
  </section>

  <!-- Timetable / Routine Section -->
  <section id="timetable" class="block alt">
    <div class="wrap">
      <div class="panel-header">
        <h2 style="font-size:18px;margin:0;">Class Routine &amp; Timetable</h2>
        <span id="ttStatus" style="font-size:13px;color:var(--success);font-weight:600;"></span>
      </div>

      <div class="tools" style="margin-top:0;">
        <label style="font-size:14px;font-weight:600;">Semester:
          <select id="tsem" style="margin-left:6px;"></select>
        </label>
      </div>

      <div class="scroll"><table id="ttable"></table></div>
    </div>
  </section>

  <!-- Attendance Section -->
  <section id="attendance" class="block">
    <div class="wrap">
      <h2 style="font-size:18px;margin-bottom:12px;" id="attHeading">Attendance Management</h2>

      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Course Name</th>
              <th>Held</th>
              <th>Attended</th>
              <th>Percentage</th>
              <th id="attActionCol">Action</th>
            </tr>
          </thead>
          <tbody id="attBody"></tbody>
        </table>
      </div>

      <!-- Inline Student Roster & Attendance Marking Panel (Faculty) / Recent Log (Student) -->
      <div id="attCoursePanel" style="margin-top:16px;"></div>
    </div>
  </section>

  <!-- Assignments & Coursework Section (For Students & Faculty) -->
  <section id="assignments" class="block alt">
    <div class="wrap">
      <h2 style="font-size:18px;margin-bottom:12px;" id="asgHeading">Assignments &amp; Coursework</h2>

      <div class="tools" style="justify-content:space-between;margin-bottom:14px;">
        <div class="cats" role="group" aria-label="Filter assignments">
          <button type="button" class="asg-filter-btn on" data-filter="all">All</button>
          <button type="button" class="asg-filter-btn" data-filter="pending">Pending</button>
          <button type="button" class="asg-filter-btn" data-filter="submitted">Submitted</button>
          <button type="button" class="asg-filter-btn" data-filter="evaluated">Evaluated</button>
        </div>
        <input id="asgSearch" type="search" placeholder="Search assignments..." aria-label="Search assignments">
      </div>

      <div id="asgList"></div>

      <!-- Inline Submissions Review Panel (For Faculty) -->
      <div id="subReviewPanel" style="margin-top:16px;"></div>

      <!-- Action Area (Submit solution for student / Create assignment for faculty) -->
      <div id="submitBox" style="margin-top:16px;"></div>
    </div>
  </section>

  <!-- Administrator Institutional Directory (Students, Faculty & Courses View for Admin) -->
  <section id="adminRecords" class="block">
    <div class="wrap">
      <div class="panel-header">
        <h2 style="font-size:18px;margin:0;">College Institutional Directory</h2>
        <div class="cats" role="group">
          <button type="button" class="rec-tab-btn on" id="btnShowStudents">Students</button>
          <button type="button" class="rec-tab-btn" id="btnShowFaculty">Faculty Members</button>
          <button type="button" class="rec-tab-btn" id="btnShowCourses">Courses</button>
        </div>
      </div>

      <div class="scroll">
        <table id="recordsTable">
          <thead id="recordsThead"></thead>
          <tbody id="recordsTbody"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <span>ABC College</span>
    <span id="footerDate"></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../backend/app.js"></script>
<script src="../backend/faculty.js"></script>
<script src="home.js"></script>
</body>
</html>
