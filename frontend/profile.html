<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABC College - User Profile</title>
<link rel="stylesheet" href="home.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="home.html"><b>ABC College</b></a>
    <button class="menu" id="menu" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav"></nav>
  </div>
</header>

<main>

  <section class="page-banner">
    <div class="wrap">
      <h1 id="pBannerTitle">User Profile</h1>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <div class="profile-layout">

        <!-- Left: Summary Avatar & Role Card -->
        <aside class="profile-card">
          <div class="profile-avatar" id="pAvatar">U</div>
          <h2 id="pName">User Name</h2>
          <div class="roll" id="pCode">ID: Loading...</div>
          <p style="margin-bottom:14px;"><span class="badge badge-ok" id="pBadge">Role Badge</span></p>

          <div id="pSummaryBlock" style="text-align:left;font-size:13px;border-top:1px solid var(--border-color);padding-top:14px;margin-top:10px;"></div>

          <div style="margin-top:18px;display:flex;flex-direction:column;gap:8px;">
            <button type="button" id="logoutBtn" class="btn btn-danger" style="width:100%;font-weight:600;">Log Out</button>
          </div>
        </aside>

        <!-- Right: Role-Tailored Information Panels -->
        <div id="pContentArea">
          <div class="card-box" id="pContactCard">
            <div class="panel-header">
              <h3 style="margin:0;">Institutional Profile Details</h3>
              <button type="button" id="editProfileBtn" class="btn btn-outline btn-sm">Edit Profile</button>
            </div>

            <div class="info-grid" id="profileViewGrid">
              <div class="info-field">
                <label>Full Name</label>
                <span id="pDetailName">—</span>
              </div>
              <div class="info-field">
                <label>Registered Email</label>
                <span id="pDetailEmail">—</span>
              </div>
              <div class="info-field">
                <label>Institutional Role</label>
                <span id="pDetailRole" style="text-transform:capitalize;">—</span>
              </div>
              <div class="info-field">
                <label id="pDetailCodeLabel">Roll / Faculty ID</label>
                <span id="pDetailCode">—</span>
              </div>
              <div class="info-field">
                <label>Department</label>
                <span id="pDetailDept">—</span>
              </div>
              <div class="info-field" id="pDetailSemField">
                <label>Current Semester</label>
                <span id="pDetailSem">—</span>
              </div>
            </div>

            <form id="profileEditForm" style="display:none;">
              <div class="info-grid">
                <div class="info-field">
                  <label for="editName">Full Name</label>
                  <input type="text" id="editName" style="width:100%;" required>
                </div>
                <div class="info-field">
                  <label for="editEmail">Registered Email (Read-only)</label>
                  <input type="email" id="editEmail" style="width:100%;opacity:0.7;cursor:not-allowed;" readonly disabled>
                </div>
                <div class="info-field">
                  <label for="editRole">Institutional Role (Read-only)</label>
                  <input type="text" id="editRole" style="width:100%;opacity:0.7;cursor:not-allowed;text-transform:capitalize;" readonly disabled>
                </div>
                <div class="info-field">
                  <label for="editCode" id="editCodeLabel">Roll / Faculty ID</label>
                  <input type="text" id="editCode" style="width:100%;" required>
                </div>
                <div class="info-field">
                  <label for="editDept">Department</label>
                  <input type="text" id="editDept" style="width:100%;" required>
                </div>
                <div class="info-field" id="editSemField">
                  <label for="editSem">Current Semester</label>
                  <select id="editSem" style="width:100%;">
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                  </select>
                </div>
              </div>
              <p id="profileMsg" class="fmsg" role="status"></p>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button type="submit" class="btn btn-sm" id="saveProfileBtn">Save Changes</button>
                <button type="button" id="cancelEditBtn" class="btn btn-outline btn-sm">Cancel</button>
              </div>
            </form>
          </div>

          <div id="pRoleMainCard"></div>
        </div>

      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <span>ABC College</span>
    <span id="footerDate"></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../backend/app.js"></script>
<script src="../backend/profile.js"></script>
</body>
</html>
