<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CampusConnect — College Management System Portal">
  <title>ABC College — Sign In</title>
  <link rel="stylesheet" href="auth/auth.css">
</head>
<body>

  <button class="theme-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
    <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <div class="card">
    <div class="brand">ABC College</div>
    <h1 id="authHeading">Sign in</h1>
    <p class="subtitle" id="authSubtitle">Enter your college email or roll number to access the portal</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="userId">Email / Roll No</label>
        <input type="text" id="userId" name="userId" placeholder="name@college.edu or Roll No" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>

      <div style="text-align:right;margin:-8px 0 14px;">
        <a href="#" id="forgotPassLink" style="font-size:13px;color:var(--brand);text-decoration:none;font-weight:600;">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Sign in</button>
    </form>

    <!-- Forgot Password Form -->
    <form id="forgotForm" style="display:none;">
      <div class="form-group">
        <label for="resetEmail">Registered Email or Roll / Faculty ID</label>
        <input type="text" id="resetEmail" placeholder="name@college.edu or Roll No" required>
      </div>
      <p id="resetMsg" style="font-size:13px;margin-bottom:10px;"></p>
      <button type="submit" class="btn-submit" id="resetBtn">Send Reset Link</button>
      <div class="footer-link" style="margin-top:14px;">
        <a href="#" id="backToLogin">Back to Sign in</a>
      </div>
    </form>

    <!-- Password Recovery (Set New Password) Form -->
    <form id="recoveryForm" style="display:none;">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Minimum 6 characters" minlength="6" required>
      </div>
      <p id="recoveryMsg" style="font-size:13px;margin-bottom:10px;"></p>
      <button type="submit" class="btn-submit" id="recoveryBtn">Update Password</button>
    </form>

    <div class="footer-link" id="signupFooterLink">
      New to the portal? <a href="auth/signup.html">Activate account</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth/auth.js"></script>
</body>
</html>
